name: Build & Release (Windows + Linux)

# Pipeline « monstre » : chaque exe/installeur passe d'abord la batterie de
# tests, puis est compile (PyInstaller) :
#   - Windows  -> GestionScolaire.exe + installeur Inno Setup (.exe)
#   - Linux    -> paquet .deb + AppImage portable
# Sur poussee d'un tag v*, tous les installateurs sont publies en GitHub
# Release. Un smoke test lance l'application (offscreen) avant upload.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1. GARDE-FOU : la suite complete doit etre verte avant de compiler
  # ------------------------------------------------------------------
  tests:
    name: Tests (garde-fou)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependances systeme (Qt offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-glx libglib2.0-0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-shape0

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r server/requirements.txt pytest

      - name: Suite de tests bureau + serveur
        run: |
          python -m pytest tests server -q

      - name: Exercice des services (rapports, factures, sauvegardes…)
        run: |
          python -m pytest tests/test_assistant_ia_ui.py -q

  # ------------------------------------------------------------------
  # 2. WINDOWS : exe + installeur Inno Setup + portable zip
  # ------------------------------------------------------------------
  windows:
    name: Windows (exe + Inno Setup)
    needs: tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_CERTIFICATE_PROFILE_ID: ${{ secrets.SIGNPATH_CERTIFICATE_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Version de l'application
        id: version
        shell: bash
        run: echo "app_version=$(python -c 'import sys; sys.path.insert(0, \".\"); import build_app; print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Verifier les icones
        shell: bash
        run: |
          ls -la assets
          test -f assets/icon.ico
          test -f assets/icon.png

      - name: Compiler l'application (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller build_win.spec --noconfirm --clean \
            --distpath dist --workpath build

      - name: Smoke test de l'exe (offscreen)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/GestionScolaire/GestionScolaire.exe &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "L'appli tourne toujours -> smoke test OK"
            kill $PID
          else
            echo "L'appli a quitte >8s apres son lancement -> ECHEC du smoke test"
            exit 1
          fi

      - name: Creer l'installeur Inno Setup
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_installer
          _build_installer()

      - name: Empaqueter la version portable (.zip)
        shell: bash
        run: |
          powershell -Command "Compress-Archive -Path dist/GestionScolaire -DestinationPath dist/GestionScolaire-Portable-${{ steps.version.outputs.app_version }}.zip -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire-Portable-*.zip

  # ------------------------------------------------------------------
  # 3. LINUX : .deb + AppImage portable
  # ------------------------------------------------------------------
  linux:
    name: Linux (.deb + AppImage)
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependances systeme (Qt/XCB)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-dev python3-pip python3-venv \
            libgl1-mesa-glx libglib2.0-0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-shape0 \
            wget dpkg-dev fakeroot

      - name: Dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version de l'application
        id: version
        run: echo "app_version=$(python -c 'import sys; sys.path.insert(0, \".\"); import build_app; print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Verifier les icones
        run: |
          ls -la assets
          test -f assets/icon.ico
          test -f assets/icon.png

      - name: Compiler l'application (PyInstaller)
        run: |
          python -m PyInstaller build_linux.spec --noconfirm --clean \
            --distpath dist --workpath build

      - name: Smoke test du binaire (offscreen)
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 12 ./dist/gestion-scolaire/gestion-scolaire
          CODE=$?
          set -e
          if [ "$CODE" = 124 ]; then
            echo "L'appli tourne toujours apres 12s -> smoke test OK"
          elif [ "$CODE" = 0 ]; then
            echo "L'appli a quitte immediatement -> ECHEC du smoke test"
            exit 1
          else
            echo "L'appli a plante (code $CODE) -> ECHEC du smoke test"
            exit 1
          fi

      - name: Creer le paquet .deb
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_deb
          _build_deb()

      - name: Creer l'AppImage portable
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          APPDIR=dist/AppDir
          rm -rf "$APPDIR" dist/*.AppImage
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -a dist/gestion-scolaire/. "$APPDIR/usr/bin/"

          # AppRun : point d'entree de l'AppImage
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/gestion-scolaire" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Descripteur de bureau + icone (racine ET usr/share : appimagetool
          # exige .desktop et icon a la racine de l'AppDir)
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Gestion Scolaire' \
            'Comment=Application de gestion scolaire' \
            'Exec=gestion-scolaire' \
            'Icon=gestion-scolaire' \
            'Terminal=false' \
            'Categories=Education;' > "$APPDIR/usr/share/applications/gestion-scolaire.desktop"
          cp "$APPDIR/usr/share/applications/gestion-scolaire.desktop" "$APPDIR/gestion-scolaire.desktop"
          cp assets/icon.png "$APPDIR/gestion-scolaire.png"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/gestion-scolaire.png"
          cp assets/icon.png "$APPDIR/.DirIcon"

          # L'AppImage embarque sa Qt ; APPIMAGE_EXTRACT_AND_RUN evite FUSE
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" \
            dist/GestionScolaire-${{ steps.version.outputs.app_version }}.AppImage

      - name: Smoke test de l'AppImage (offscreen)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 12 \
            ./dist/GestionScolaire-${{ steps.version.outputs.app_version }}.AppImage
          CODE=$?
          set -e
          if [ "$CODE" = 124 ]; then
            echo "AppImage vivante apres 12s -> OK"
          else
            echo "AppImage a echoue (code $CODE)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Linux-${{ steps.version.outputs.app_version }}
          path: |
            installers/*.deb
            dist/*.AppImage

  # ------------------------------------------------------------------
  # 4. RELEASE : public les installateurs sur un tag v*
  # ------------------------------------------------------------------
  release:
    name: Publier la release
    needs: [tests, windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Contenu des artefacts
        run: find artifacts -type f | sort

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}