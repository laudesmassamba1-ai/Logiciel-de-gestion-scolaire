name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: echo "app_version=$(python -c 'import build_app;print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        shell: python
        run: from build_app import _ensure_icon; _ensure_icon()

      - name: Build application
        shell: python
        run: from build_app import _build_windows; _build_windows()

      - name: Prepare signing certificate
        shell: pwsh
        env:
          WIN_SIGN_PFX: ${{ secrets.WIN_SIGN_PFX }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WIN_SIGN_PFX) {
            if (-not $env:WIN_SIGN_PASSWORD) { throw "WIN_SIGN_PASSWORD manquant" }
            $password = $env:WIN_SIGN_PASSWORD
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_SIGN_PFX))
          } else {
            $password = "gestion-scolaire-ci"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Gestion Scolaire, O=Gestion Scolaire" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -KeySpec Signature -KeyUsage DigitalSignature -NotAfter (Get-Date).AddYears(3)
            Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\cert.pfx" -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
            Remove-Item -Path "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          }
          Write-Output "CERT_PATH=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV
          Write-Output "CERT_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Sign binaries and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable" }
          if (Test-Path "dist\GestionScolaire\GestionScolaire.exe") {
            & $signtool.FullName sign /f "$env:CERT_PATH" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\GestionScolaire\GestionScolaire.exe"
            Write-Output "Binaire signe"
          }
          $setup = Get-ChildItem "installers\GestionScolaire-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            & $signtool.FullName sign /f "$env:CERT_PATH" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
            Write-Output "Installeur signe"
          } else {
            Write-Output "Pas d'installeur a signer (Inno Setup non disponible?)" -ForegroundColor Yellow
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire/GestionScolaire.exe
