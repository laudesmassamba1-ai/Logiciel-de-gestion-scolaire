name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: echo "app_version=$(python -c 'import build_app;print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        shell: python
        run: from build_app import _ensure_icon; _ensure_icon()

      - name: Build application
        shell: python
        run: from build_app import _build_windows; _build_windows()

      - name: Install Windows SDK SignTool
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Sign EXE with SignPath.io (free for open source)
        if: secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_CERTIFICATE_PROFILE_ID != ''
        uses: signpath/action@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          certificate-profile-id: ${{ secrets.SIGNPATH_CERTIFICATE_PROFILE_ID }}
          input-file: dist/GestionScolaire/GestionScolaire.exe
          output-file: dist/GestionScolaire/GestionScolaire-signed.exe
          sign-operation: SignToolOperation_Sign
          sign-options: '{"signingMode":"SignToolSignMode_RealSign","timestampDigestAlgorithm":"TimestampDigestAlgorithm_Sha256"}'

      - name: Replace EXE with signed version
        if: secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_CERTIFICATE_PROFILE_ID != ''
        shell: pwsh
        run: |
          if (Test-Path "dist\GestionScolaire\GestionScolaire-signed.exe") {
            Remove-Item "dist\GestionScolaire\GestionScolaire.exe" -Force
            Move-Item "dist\GestionScolaire\GestionScolaire-signed.exe" "dist\GestionScolaire\GestionScolaire.exe"
            Write-Output "EXE signe remplace"
          } else {
            Write-Output "Aucun EXE signe trouve, conservation de l'original"
          }

      - name: Build installer
        shell: python
        run: from build_app import _build_installer; _build_installer()

      - name: Sign installer with SignPath.io
        if: secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_CERTIFICATE_PROFILE_ID != ''
        uses: signpath/action@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          certificate-profile-id: ${{ secrets.SIGNPATH_CERTIFICATE_PROFILE_ID }}
          input-file: installers/GestionScolaire-Setup-${{ steps.version.outputs.app_version }}.exe
          output-file: installers/GestionScolaire-Setup-${{ steps.version.outputs.app_version }}-signed.exe
          sign-operation: SignToolOperation_Sign
          sign-options: '{"signingMode":"SignToolSignMode_RealSign","timestampDigestAlgorithm":"TimestampDigestAlgorithm_Sha256"}'

      - name: Replace installer with signed version
        if: secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_CERTIFICATE_PROFILE_ID != ''
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installers\GestionScolaire-Setup-*-signed.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Remove-Item "installers\GestionScolaire-Setup-${{ steps.version.outputs.app_version }}.exe" -Force
            Move-Item $setup.FullName "installers\GestionScolaire-Setup-${{ steps.version.outputs.app_version }}.exe"
            Write-Output "Installeur signe remplace"
          } else {
            Write-Output "Aucun installeur signe trouve, conservation de l'original"
          }

      - name: Verify signatures
        if: secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_CERTIFICATE_PROFILE_ID != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable" }
          Write-Output "Verification de l'EXE:"
          & $signtool.FullName verify /pa "dist\GestionScolaire\GestionScolaire.exe"
          $setup = Get-ChildItem "installers\GestionScolaire-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Write-Output "Verification de l'installeur:"
            & $signtool.FullName verify /pa $setup.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire/GestionScolaire.exe
