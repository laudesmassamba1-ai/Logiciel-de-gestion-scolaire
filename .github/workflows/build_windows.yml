name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_CERTIFICATE_PROFILE_ID: ${{ secrets.SIGNPATH_CERTIFICATE_PROFILE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Install GTK3 runtime (WeasyPrint/Pango)
        # Le paquet choco "gtk-runtime" fournit du GTK2 de 2012 (trop ancien
        # pour weasyprint 69). On installe le runtime GTK3 64 bits officiel de
        # tschoonj (pango 1.50.3, harfbuzz 3.1.2, fontconfig 2.13.94) : le hook
        # PyInstaller hook-weasyprint resolve ces DLL via find_library pour
        # les embarquer dans le bundle.
        shell: bash
        run: |
          curl -L -o /tmp/gtk3-runtime.exe \
            "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe"
          /tmp/gtk3-runtime.exe /S
          # Le PATH machine modifie par l'installeur n'est pas transmis au
          # processus courant : on l'exporte pour les etapes suivantes
          # (necessaire au hook weasyprint qui resout les DLL via find_library).
          echo "C:\\Program Files\\GTK3-Runtime Win64\\bin" >> "$GITHUB_PATH"
          echo "C:\\Program Files\\GTK3-Runtime\\bin" >> "$GITHUB_PATH"

      - name: Tests (garde-fou anti regression)
        run: |
          python -m pytest tests server -q

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: |
          APP_VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import build_app; print(build_app._version())")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check icon files
        shell: bash
        run: |
          ls -la assets
          test -f assets/icon.ico
          test -f assets/icon.png

      - name: Build application
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_windows
          _build_windows()

      - name: Build installer
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_installer
          _build_installer()

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire/GestionScolaire.exe
