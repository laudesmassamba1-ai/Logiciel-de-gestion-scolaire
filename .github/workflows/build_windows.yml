name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_CERTIFICATE_PROFILE_ID: ${{ secrets.SIGNPATH_CERTIFICATE_PROFILE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Cache GTK3 runtime installer
        # Le CDN release-assets de GitHub est aleatoire sur les runners
        # heberges : on ne telecharge le runtime (~49 Mo) qu'une seule fois,
        # puis chaque run le restaure depuis le cache interne GitHub
        # (rapide et fiable) au lieu de retaper le CDN externe.
        uses: actions/cache@v4
        id: cache-gtk3
        with:
          path: C:\gtk3-runtime.exe
          key: gtk3-runtime-3.24.31-2022-01-04

      - name: Download GTK3 runtime installer
        if: steps.cache-gtk3.outputs.cache-hit != 'true'
        # Le paquet choco "gtk-runtime" fournit du GTK2 de 2012 (trop ancien
        # pour weasyprint 69). Le runtime GTK3 64 bits officiel de tschoonj
        # (pango 1.50.3, harfbuzz 3.1.2, fontconfig 2.13.94) permet au hook
        # PyInstaller hook-weasyprint de resoudre les DLL via find_library
        # pour les embarquer dans le bundle.
        shell: bash
        run: |
          URL_GTK="https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2022-01-04/gtk3-runtime-3.24.31-2022-01-04-ts-win64.exe"
          # --max-time : fail-fast (un CDN lent ne doit jamais bloquer le build).
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 \
               --connect-timeout 60 --max-time 420 -C - \
               -o C:\\gtk3-runtime.exe "$URL_GTK" || exit 1
          SIZE_ATTENDU=$(curl -sIL --max-time 60 "$URL_GTK" \
            | tr -d '\r' | grep -i '^content-length:' | tail -1 | awk '{print $2}')
          SIZE_OBTENU=$(stat -c %s C:\\gtk3-runtime.exe 2>/dev/null || echo 0)
          echo "GTK3 runtime téléchargé : ${SIZE_OBTENU} octets (attendu : ${SIZE_ATTENDU})"
          # Taille correspondant exactement au Content-Length (troncature =
          # taille differente ; seuil absolu pour eviter un 404/HTML).
          if [ -z "$SIZE_ATTENDU" ] || [ "$SIZE_OBTENU" -lt 40000000 ] \
             || [ "$SIZE_OBTENU" != "$SIZE_ATTENDU" ]; then
            echo "::error::Téléchargement GTK3 invalide (${SIZE_OBTENU} octets) — abort"
            exit 1
          fi

      - name: Install GTK3 runtime (WeasyPrint/Pango)
        shell: bash
        run: |
          C:\\gtk3-runtime.exe /S
          # Le PATH machine modifie par l'installeur n'est pas transmis au
          # processus courant : on l'exporte pour les etapes suivantes
          # (necessaire au hook weasyprint qui resout les DLL via find_library).
          echo "C:\\Program Files\\GTK3-Runtime Win64\\bin" >> "$GITHUB_PATH"
          echo "C:\\Program Files\\GTK3-Runtime\\bin" >> "$GITHUB_PATH"

      - name: Tests (garde-fou anti regression)
        run: |
          python -m pytest tests server -q

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: |
          APP_VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import build_app; print(build_app._version())")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check icon files
        shell: bash
        run: |
          ls -la assets
          test -f assets/icon.ico
          test -f assets/icon.png

      - name: Build application
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_windows
          _build_windows()

      - name: Build installer
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_installer
          _build_installer()

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire/GestionScolaire.exe
