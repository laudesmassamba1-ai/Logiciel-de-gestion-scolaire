name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: echo "app_version=$(python -c 'import sys; sys.path.insert(0, \".\"); import build_app; print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _ensure_icon
          _ensure_icon()

      - name: Build application
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_windows
          _build_windows()

      - name: Build installer
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_installer
          _build_installer()

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire/GestionScolaire.exe
