name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-dev python3-pip python3-venv \
            libgl1-mesa-glx libglib2.0-0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-shape0 \
            libfuse2 desktop-file-utils \
            dpkg-dev fakeroot \
            wget

      - name: Install linuxdeployqt
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          sudo mv linuxdeployqt-continuous-x86_64.AppImage /usr/local/bin/linuxdeployqt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get version
        id: version
        run: echo "app_version=$(python -c 'import sys; sys.path.insert(0, \".\"); import build_app; print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _ensure_icon
          _ensure_icon()

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller build_linux.spec \
            --noconfirm --clean \
            --distpath dist \
            --workpath build

      - name: Create .deb package
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_deb
          _build_deb()

      - name: Create AppImage
        run: |
          mkdir -p appdir/usr/bin appdir/usr/share/applications appdir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/gestion-scolaire/* appdir/usr/bin/
          cat > appdir/AppRun << 'RUNEOF'
          #!/bin/sh
          exec /usr/bin/gestion-scolaire "$@"
          RUNEOF
          chmod +x appdir/AppRun
          cat > appdir/gestion-scolaire.desktop << 'DESKEOF'
          [Desktop Entry]
          Type=Application
          Name=Gestion Scolaire
          Exec=gestion-scolaire
          Icon=gestion-scolaire
          Categories=Education;
          Terminal=false
          StartupWMClass=gestion-scolaire
          DESKEOF
          cp assets/icon.png appdir/gestion-scolaire.png 2>/dev/null || true
          chmod +x appdir/gestion-scolaire.desktop
          linuxdeployqt appdir/appdir -appimage -always-overwrite -verbose=2

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Linux-${{ steps.version.outputs.app_version }}
          path: |
            installers/*.deb
            *.AppImage

  build-windows:
    env:
      QT_QPA_PLATFORM: offscreen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: echo "app_version=$(python -c 'import sys; sys.path.insert(0, \".\"); import build_app; print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Generate icon
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _ensure_icon
          _ensure_icon()

      - name: Build application
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_windows
          _build_windows()

      - name: Build installer
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_installer
          _build_installer()

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Windows-${{ steps.version.outputs.app_version }}
          path: |
            installers/GestionScolaire-Setup-*.exe
            dist/GestionScolaire/GestionScolaire.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
