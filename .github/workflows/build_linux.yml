name: Build Linux Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-dev python3-pip python3-venv \
            libgl1-mesa-glx libglib2.0-0 \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-shape0 \
            dpkg-dev fakeroot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get version
        id: version
        run: echo "app_version=$(python -c 'import sys; sys.path.insert(0, \".\"); import build_app; print(build_app._version())')" >> "$GITHUB_OUTPUT"

      - name: Check icon files
        run: |
          ls -la assets
          test -f assets/icon.ico
          test -f assets/icon.png

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller build_linux.spec \
            --noconfirm --clean \
            --distpath dist \
            --workpath build

      - name: Create .deb package
        shell: python
        run: |
          import sys
          sys.path.insert(0, ".")
          from build_app import _build_deb
          _build_deb()

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-Linux-${{ steps.version.outputs.app_version }}
          path: |
            installers/*.deb
