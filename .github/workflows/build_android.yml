name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build signed release APK
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/mobile/gestionscolaire-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.APK_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          echo "$APK_KEYSTORE_B64" | base64 -d > "$P4A_RELEASE_KEYSTORE"
          cd mobile
          ./scripts/build_apk.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: GestionScolaire-APK
          path: mobile/bin/*.apk
